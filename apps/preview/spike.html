<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Preview spike</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font:
          14px/1.5 system-ui,
          sans-serif;
        background: #f4f4f0;
        color: #111210;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      iframe {
        width: 100%;
        height: 520px;
        border: 1px solid rgba(17, 18, 16, 0.16);
        border-radius: 12px;
        background: #e6e6e0;
      }
      pre {
        font:
          12px/16px ui-monospace,
          monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <button type="button" id="render">Render example</button>
      <button type="button" id="rerender">Render again</button>
      <button type="button" id="broken">Render broken template</button>
      <span id="status" data-status="idle">idle</span>
    </div>
    <iframe
      id="frame"
      title="Preview"
      sandbox="allow-scripts allow-forms"
      src="./index.html"
    ></iframe>
    <pre id="log"></pre>
    <script type="module" src="/src/spike.ts"></script>
  </body>
</html>
